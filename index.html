<!DOCTYPE html>

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #F3F4F6; /* Abu-abu terang yang bersih */
            font-family: 'Inter', sans-serif; 
            color: #1F2937;
        }
        .hero-pattern {
            background-color: #ffffff;
            background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Kartu putih bersih */
        .clean-card {
            background: #ffffff;
            border: 1px solid #E5E7EB;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
        }
        /* Warna Biru Korporat */
        .btn-blue {
            background-color: #2563EB; /* Biru standar */
            transition: background-color 0.2s;
        }
        .btn-blue:hover {
            background-color: #1D4ED8; /* Biru lebih gelap saat hover */
        }
        .text-highlight {
            color: #2563EB;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen hero-pattern px-4">

    <div class="clean-card max-w-lg w-full p-8 md:p-10 rounded-3xl text-center">
        <!-- Icon Section - Diubah menjadi logo layanan -->
        <div class="mb-8 inline-flex">
            <div class="relative w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center">
                <i class="fas fa-video text-4xl text-blue-600"></i>
            </div>
        </div>
        
        <!-- Text Content - Lebih deskriptif dan profesional -->
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight mb-5">
            Akses Video <span class="text-highlight">Eksklusif</span>
        </h1>
        <p class="text-gray-600 text-lg leading-relaxed mb-10 px-2">
            Anda telah diberikan akses untuk menonton video berdurasi penuh dalam kualitas <span class="font-semibold text-gray-800">1080p Full HD</span>. Klik tombol di bawah untuk melanjutkan ke pemutar video aman kami.
        </p>

        <!-- Action Button - Warna biru yang lebih dipercaya -->
        <button id="startBtn" class="group w-full btn-blue text-white font-semibold py-5 px-8 rounded-xl text-lg shadow-lg shadow-blue-500/30 active:scale-[0.98] flex items-center justify-center gap-3">
            <i class="fas fa-lock text-sm"></i>
            Lanjutkan ke Video
        </button>

        <!-- Trust Badge - Diperbarui -->
        <div class="mt-10 pt-6 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-center gap-4 text-gray-500 text-sm">
            <span class="flex items-center gap-2">
                <i class="fas fa-shield-alt text-green-500"></i> Tautan Diverifikasi
            </span>
            <span class="hidden sm:inline text-gray-300">|</span>
            <span class="flex items-center gap-2">
                <i class="fas fa-user-shield text-green-500"></i> Bebas Malware & Iklan Mengganggu
            </span>
        </div>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            setTimeout(function() {
                window.open('watch.html', '_blank');
                window.location.href = 'https://financetrack1.blogspot.com/';
            }, 100);
        });
    </script>
